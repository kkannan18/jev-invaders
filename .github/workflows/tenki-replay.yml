name: Tenki replay
on:
  push:
    branches: [main]
    paths-ignore: ["results.json"]
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Replay reference games in Tenki sandboxes
        env:
          TENKI_API_KEY: ${{ secrets.TENKI_API_KEY }}
        run: python ci_replay.py
